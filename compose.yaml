services:
  app:
    build: .
    container_name: ekaramchari-app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ekaramchari
      DB_USER: ekaramchari
      DB_PASS: ${DB_PASSWORD:-ekaramchari_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/var/www/html/backend/logs
      - ./backend/uploads:/var/www/html/backend/uploads

  db:
    image: mysql:8.0
    container_name: ekaramchari-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ekaramchari
      MYSQL_USER: ekaramchari
      MYSQL_PASSWORD: ${DB_PASSWORD:-ekaramchari_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_demo_password}
    ports:
      - "3307:3306"
    volumes:
      - ekaramchari_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ekaramchari_mysql:
